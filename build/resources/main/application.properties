server.port=8080
spring.application.name=greeting-service

# Kafka consumer config
# KAFKA_BOOTSTRAP_SERVERS is injected via ConfigMap in Kubernetes
# Falls back to localhost for local development
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=greeting-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.greetingservice
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.greetingservice.GreetingRequestedEvent
